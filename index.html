<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageQuest – Read. Earn. Grow.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14203C; --soft:#636F87; --mist:#919BB0;
  --blue:#3069DC; --cyan:#42D3E6; --pink:#F5709D; --sun:#FFC93C; --leaf:#3DBE7A;
  --paper:#FFF8EC; --card:#FFFFFF; --line:#14203C;
  --rs:22px;
  --head:"Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:600;font-size:18px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,#42d3e633 0 90px,transparent 91px),radial-gradient(circle at 92% 18%,#f5709d2e 0 120px,transparent 121px);
  background-attachment:fixed;min-height:100vh}
body.easy{--body:"Verdana","Trebuchet MS",sans-serif;letter-spacing:.03em;word-spacing:.12em}
h1,h2,h3{font-family:var(--head);margin:0 0 .3em;line-height:1.1}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800}
h2{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800}
h3{font-size:1.25rem;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:980px;margin:0 auto;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:800;font-size:1.5rem;background:none;border:0;padding:0}
.logo small{display:block;font-family:var(--body);font-size:.62rem;letter-spacing:.14em;color:var(--soft);font-weight:800;margin-top:-6px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.95rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:3px solid var(--line);border-radius:16px;
  padding:12px 20px;font-weight:800;font-size:1.05rem;box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s;text-decoration:none;min-height:50px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.pink{background:var(--pink)} .btn.sun{background:var(--sun);color:var(--ink)} .btn.leaf{background:var(--leaf)}
.btn.ghost{background:#fff;color:var(--ink)} .btn.small{padding:6px 14px;min-height:40px;font-size:.95rem;box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
:focus-visible{outline:4px solid var(--cyan);outline-offset:3px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--line)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.muted{color:var(--soft);font-weight:700}
.tag{display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:99px;border:2px solid var(--line);background:var(--sun)}
.tag.blue{background:var(--cyan)} .tag.pink{background:var(--pink)} .tag.leaf{background:var(--leaf)}
.bar{height:16px;border-radius:99px;border:3px solid var(--line);background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:99px;transition:width .6s}
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:8px 0 18px}
@media(max-width:620px){.hero{grid-template-columns:1fr}.hero svg{display:none}}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 16px;display:inline-block}
.bubble:before{content:"";position:absolute;left:24px;bottom:-14px;width:22px;height:22px;background:#fff;border-right:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg) skew(8deg,8deg)}
.who{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 10px;box-shadow:0 6px 0 var(--line);width:100%}
.who:hover{transform:translateY(-3px)}
.who .av{font-size:3.2rem;line-height:1}
.cover{border:3px solid var(--line);border-radius:18px;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#fff;position:relative;overflow:hidden;box-shadow:5px 5px 0 var(--line);text-align:left;width:100%}
.cover:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:4px;background:#0003}
.cover .em{font-size:3rem;text-align:center;margin-top:8px;filter:drop-shadow(0 3px 0 #0003)}
.cover b{font-family:var(--head);font-size:1.15rem;line-height:1.1;text-shadow:0 2px 0 #0004;padding-left:10px}
.cover small{padding-left:10px;font-weight:800;opacity:.95}
.bookbtn{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.bookbtn:hover .cover{transform:rotate(-1.5deg) translateY(-3px)}
.cover{transition:transform .15s}
.addtile{border:3px dashed var(--line);border-radius:18px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff9;font-weight:800;text-align:center;padding:10px;width:100%}
.addtile span{font-size:2.6rem;line-height:1}
.path{position:relative;display:flex;flex-direction:column;gap:14px;margin-top:12px}
.step{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start}
.node{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:1.5rem;background:#fff;font-family:var(--head);font-weight:800;position:relative;z-index:1}
.step.done .node{background:var(--leaf)} .step.now .node{background:var(--sun);animation:pulse 1.6s infinite} .step.lock .node{background:#e8ebf2}
.step.lock .card{background:#f1f3f8;box-shadow:0 4px 0 var(--mist);border-color:var(--mist);color:var(--soft)}
@keyframes pulse{50%{transform:scale(1.08)}}
.peek{background:#e9fbff;border:3px dashed var(--blue);border-radius:16px;padding:10px 14px;margin-top:10px;font-weight:700}
.reader{background:#fffdf7}
.reader .text{font-size:var(--rs);line-height:1.85;max-width:62ch;margin:0 auto}
.reader .text p{margin:0 0 1.1em}
.reader .text p:first-child:first-letter{font-family:var(--head);font-size:3.2em;float:left;line-height:.85;padding:.05em .12em 0 0;color:var(--blue)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.q{font-family:var(--head);font-size:clamp(1.35rem,4vw,1.9rem);font-weight:800;line-height:1.25;margin:10px 0 18px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:12px;font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 var(--line)}
.opt:hover{background:#eef4ff}
.opt.right{background:var(--leaf);color:#fff} .opt.wrong{background:#ffd3e2} .opt.dim{opacity:.55}
.dots{display:flex;gap:8px;margin-bottom:6px}.dots i{width:34px;height:12px;border-radius:9px;border:3px solid var(--line);background:#fff}.dots i.on{background:var(--cyan)}.dots i.ok{background:var(--leaf)}.dots i.no{background:var(--pink)}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px;border:3px solid var(--line);border-radius:18px;background:#fff;font-size:.85rem;font-weight:800}
.badge span{font-size:2.2rem;line-height:1}.badge.off{filter:grayscale(1);opacity:.45;border-style:dashed}
.badges{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
label{display:block;font-weight:800;margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;font:inherit;font-weight:700;border:3px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink)}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pick{width:52px;height:52px;border-radius:14px;border:3px solid var(--line);background:#fff;font-size:1.7rem;display:grid;place-items:center;padding:0}
.pick.sel{background:var(--sun);box-shadow:0 4px 0 var(--line);transform:translateY(-3px)}
.sw{width:42px;height:42px;border-radius:50%}
.sw.sel{outline:4px solid var(--ink);outline-offset:2px}
.chap{border:3px solid var(--line);border-radius:18px;padding:14px;margin:14px 0;background:#fffdf7}
.modal{position:fixed;inset:0;background:#14203Ca8;display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-width:440px;width:100%;max-height:92vh;overflow:auto}
.tabs{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap}
.tab{background:#fff;border:3px solid var(--line);border-radius:99px;padding:6px 18px;font-weight:800}
.tab.on{background:var(--ink);color:#fff}
details{border-top:2px dashed var(--mist);margin-top:10px;padding-top:8px}
summary{cursor:pointer;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{text-align:left;padding:6px 8px;border-bottom:2px solid #e3e7ef}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:800;z-index:99;box-shadow:0 5px 0 #0005;max-width:92vw;text-align:center}
.conf{position:fixed;top:-30px;font-size:1.6rem;animation:fall linear forwards;pointer-events:none;z-index:60}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.big{font-family:var(--head);font-size:clamp(3rem,12vw,5.5rem);font-weight:800;line-height:1;color:var(--blue)}
.center{text-align:center}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.hint{font-size:.9rem;color:var(--soft);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="top"></div>
<main id="app" class="wrap" aria-live="polite"></main>
<div id="modal"></div>

<script>
/* ============================================================
   PageQuest – by ByteBuilders
   Read a chapter → answer a quick check-in → earn → unlock the next peek.
   Everything is stored on this device only (localStorage). No accounts, no tracking.
   ============================================================ */

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const today = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const words = t => (t.trim().match(/\S+/g) || []).length;
const AVATARS = ['🦊','🐼','🦁','🐸','🦄','🐙','🦋','🐢','🐯','🐧','🦉','🐬'];
const EMOJIS = ['📘','🦁','🚀','🌳','🐉','🧜','🏰','🔬','⚽','🎨','🌍','🐢','🕯️','🦖','🌈','🎶'];
const COLORS = ['#3069DC','#F5709D','#3DBE7A','#F59E0B','#8B5CF6','#0EA5B7','#E4572E'];

/* ---------- Pip, our bookworm ---------- */
const pip = (s = 120, mood = 'happy') => `<svg width="${s}" height="${s}" viewBox="0 0 120 120" aria-hidden="true">
 <circle cx="30" cy="92" r="16" fill="#3DBE7A" stroke="#14203C" stroke-width="4"/>
 <circle cx="55" cy="96" r="16" fill="#52d08c" stroke="#14203C" stroke-width="4"/>
 <circle cx="82" cy="84" r="18" fill="#3DBE7A" stroke="#14203C" stroke-width="4"/>
 <circle cx="86" cy="52" r="26" fill="#52d08c" stroke="#14203C" stroke-width="4"/>
 <circle cx="76" cy="48" r="9" fill="#fff" stroke="#14203C" stroke-width="3.5"/><circle cx="98" cy="48" r="9" fill="#fff" stroke="#14203C" stroke-width="3.5"/>
 <path d="M85 48h4" stroke="#14203C" stroke-width="3.5"/>
 <circle cx="77" cy="49" r="3" fill="#14203C"/><circle cx="99" cy="49" r="3" fill="#14203C"/>
 ${mood === 'wow' ? '<ellipse cx="88" cy="68" rx="6" ry="7" fill="#14203C"/>' : '<path d="M77 64q11 12 22 0" fill="none" stroke="#14203C" stroke-width="4" stroke-linecap="round"/>'}
 <path d="M80 28q-6-14-14-12M94 28q4-14 14-14" fill="none" stroke="#14203C" stroke-width="4" stroke-linecap="round"/>
 <circle cx="66" cy="16" r="4" fill="#F5709D"/><circle cx="108" cy="14" r="4" fill="#F5709D"/></svg>`;

/* ---------- starter library (all original stories, written for PageQuest) ---------- */
const Q = (q, a, w1, w2) => ({ q, a, w: [w1, w2] });
const SEED_BOOKS = [
 { id: 'seed-thandi', title: 'Thandi and the Lantern', author: 'ByteBuilders Story Club', emoji: '🕯️', color: '#8B5CF6', addedBy: 'teacher', approved: true, chapters: [
  { title: 'The Light Under the Jacaranda',
    text: `Thandi lived on Jacaranda Street, where every October the trees turned the whole road purple.\n\nOne evening she chased her cat, Biscuit, all the way into Gogo's garden. Biscuit stopped under the biggest jacaranda tree and stared at the roots. Something down there was glowing.\n\nIt was a lantern, no bigger than a teacup, made of copper and green glass. When Thandi picked it up it was warm, like a mug of rooibos tea. Biscuit sniffed it and sneezed.\n\nInside, a little flame the colour of honey leaned towards her. "Finally," it whispered. "Someone with small, careful hands."\n\nThandi was so surprised that she almost dropped it. Almost.`,
    summary: 'Thandi finds a warm, glowing lantern under a jacaranda tree, and the flame inside talks to her.',
    qs: [Q('Where did Thandi find the lantern?', 'Under the biggest jacaranda tree', 'On Gogo\'s roof', 'In her school bag'), Q('What is the name of Thandi\'s cat?', 'Biscuit', 'Pepper', 'Sipho'), Q('What colour was the flame?', 'Honey', 'Red', 'Blue')] },
  { title: 'The Flame Who Was Lost',
    text: `Thandi carried the lantern to her bedroom and shut the door very softly.\n\n"My name is Lumo," said the flame. "I live in the big lighthouse by the sea, but one windy night I blew right out of the lamp room. I tumbled for miles. Now I cannot find my way home."\n\nThandi felt a lump in her throat. She knew what it was like to be far from home. Last year she had been lost in a shopping centre for ten whole minutes, and it had felt like ten years.\n\n"I can only go home if someone brings me three things," Lumo said. "Something that shows the way. Something that comes from the sea. And something that sounds like home."\n\nThandi pulled her notebook from under her pillow and wrote the list in her neatest handwriting. "Don't worry," she said. "I'm good at lists."`,
    summary: 'Lumo explains he is lost and needs three special things to get home. Thandi promises to help.',
    qs: [Q('Where does Lumo usually live?', 'In a lighthouse by the sea', 'In a cave', 'In Gogo\'s kitchen'), Q('How many things does Lumo need to get home?', 'Three', 'Five', 'Two'), Q('Where did Thandi write the list?', 'In her notebook', 'On her hand', 'On the wall')] },
  { title: 'Three Things for the Sea',
    text: `On Saturday, Gogo agreed to take Thandi to the beach. "To see the waves," Thandi said, which was almost true.\n\nIn her backpack she had packed everything on the list. For the thing that shows the way, she had Dad's old compass. For the thing from the sea, she had a pinch of salt from the jar Gogo kept from their last holiday. And for the thing that sounds like home, she had a song.\n\nAt the shore, the wind was loud and the lighthouse stood tall and white. Thandi held up the lantern. She set the compass on the sand, sprinkled the salt, and sang the lullaby Gogo always hummed when she was small.\n\nFar up on the cliff, the great lamp flashed twice. Lumo rose out of the lantern like a golden bird and flew home.\n\nBut he left behind one tiny spark. It still glows whenever Thandi is brave.`,
    summary: 'Thandi brings the compass, the salt and Gogo\'s lullaby to the sea. Lumo gets home, and leaves a gift.',
    qs: [Q('What did Thandi use for the "thing that shows the way"?', 'Dad\'s old compass', 'A torch', 'A map of Africa'), Q('What did Thandi sing?', 'The lullaby Gogo hums', 'A school song', 'A song from the radio'), Q('What did Lumo leave behind?', 'A tiny spark', 'A feather', 'A golden key')] }
 ]},
 { id: 'seed-pip', title: 'Pip\'s Weird Animal Facts', author: 'Pip the Bookworm', emoji: '🐙', color: '#0EA5B7', addedBy: 'teacher', approved: true, chapters: [
  { title: 'The Octopus Has Three Hearts',
    text: `Hello, it's me, Pip! Today I want to tell you about the octopus, one of the cleverest animals in the sea.\n\nAn octopus has three hearts. Two of them pump blood past the gills so it can pick up oxygen. The third heart sends blood around the rest of the body.\n\nThe blood of an octopus is blue, not red. That is because it carries oxygen using a metal called copper.\n\nAn octopus has no bones, so it can squeeze through a gap about as small as its own eye. Scientists have watched octopuses open jars from the inside. Imagine being that clever without even having a nose!`,
    summary: 'Octopuses have three hearts, blue blood and no bones. They are also very clever.',
    qs: [Q('How many hearts does an octopus have?', 'Three', 'One', 'Eight'), Q('What colour is octopus blood?', 'Blue', 'Red', 'Green'), Q('Why can an octopus squeeze through tiny gaps?', 'It has no bones', 'It is very small', 'It has big muscles in its legs')] },
  { title: 'Honeybees Dance to Give Directions',
    text: `Honeybees cannot talk, so how do they tell their friends where the best flowers are? They dance!\n\nWhen a bee finds a lot of nectar, she flies back to the hive and wiggles in a special pattern called the waggle dance. The angle of her dance shows which direction to fly. The longer she waggles, the farther away the flowers are.\n\nThe other bees watch closely, then zoom off to find the flowers. All of this happens in the dark inside the hive.\n\nOne honeybee makes only a tiny bit of honey in her whole life, about one twelfth of a teaspoon. That means the honey on your toast took a very big team.`,
    summary: 'Honeybees do a waggle dance to show their friends where flowers are. One bee makes only a tiny bit of honey.',
    qs: [Q('What is the bee dance called?', 'The waggle dance', 'The buzz dance', 'The flower dance'), Q('What does a longer waggle tell the other bees?', 'The flowers are farther away', 'The flowers are very close', 'It is going to rain'), Q('Where does the dancing happen?', 'Inside the hive', 'On a flower', 'On the ground')] },
  { title: 'Elephants Listen With Their Feet',
    text: `Elephants are the biggest animals that live on land, and they have some amazing talents.\n\nThey can make very deep rumbles that people can hardly hear. These low sounds travel through the air and also through the ground. Other elephants far away can feel the rumbles through their feet.\n\nAn elephant's trunk is a nose and a hand all in one. It has thousands of tiny muscles, so it can pick up a single peanut or pull down a whole branch. It also works like a snorkel when elephants swim.\n\nHere is a funny fact: elephants cannot jump. But they are wonderful swimmers, and they love a good mud bath to keep the sun off their skin.`,
    summary: 'Elephants rumble to talk across long distances, use their trunks like hands, and cannot jump.',
    qs: [Q('How can far-away elephants feel a rumble?', 'Through their feet', 'Through their tails', 'Through their tusks'), Q('What can an elephant\'s trunk be used as when swimming?', 'A snorkel', 'A paddle', 'A rope'), Q('What can elephants NOT do?', 'Jump', 'Swim', 'Take a mud bath')] }
 ]}
];

/* ---------- badges ---------- */
const BADGES = [
 { id: 'first', e: '🌱', n: 'First Chapter', d: 'Finished your very first chapter', test: (L) => chaptersDone(L) >= 1 },
 { id: 'sharp', e: '🧠', n: 'Sharp Thinker', d: 'Got every check-in question right', test: (L, ctx) => ctx && ctx.total > 0 && ctx.score === ctx.total },
 { id: 'book', e: '📕', n: 'Book Finished', d: 'Read a whole book, start to end', test: (L, ctx) => ctx && ctx.bookDone },
 { id: 'three', e: '🔥', n: 'Three-Day Streak', d: 'Read three days in a row', test: (L) => L.streak >= 3 },
 { id: 'five', e: '🏔️', n: 'Chapter Climber', d: 'Finished five chapters', test: (L) => chaptersDone(L) >= 5 },
 { id: 'builder', e: '🛠️', n: 'Book Builder', d: 'Added a book to the shelf', test: (L, ctx) => ctx && ctx.built },
];
const chaptersDone = L => Object.values(L.progress || {}).reduce((n, p) => n + p.done.length, 0);

/* ---------- state ---------- */
const KEY = 'pagequest.bytebuilders.v1';
let S;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.books) return d; } } catch (e) {}
  return { pin: null, learners: [], books: JSON.parse(JSON.stringify(SEED_BOOKS)), log: [], goal: 30, easy: false };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
S = load();
if (S.easy) document.body.classList.add('easy');

let ui = { view: 'welcome', me: null, teacher: false, bookId: null, ch: 0, tab: 'class', rs: 22, draft: null, quiz: null, reward: null, modal: null };
const me = () => S.learners.find(l => l.id === ui.me);
const book = id => S.books.find(b => b.id === id);
const visibleBooks = () => S.books.filter(b => ui.teacher || b.approved || (me() && b.ownerId === me().id));
const prog = (L, bid) => (L.progress[bid] ||= { done: [], best: {} });

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function confetti() { const bits = ['⭐','🎉','✨','📚','💙','🌟']; for (let i = 0; i < 28; i++) { const c = document.createElement('span'); c.className = 'conf'; c.textContent = bits[i % bits.length]; c.style.left = Math.random() * 100 + 'vw'; c.style.animationDuration = 2 + Math.random() * 2.5 + 's'; c.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(c); setTimeout(() => c.remove(), 5500); } }

/* ---------- question maker: teacher/learner questions first, then auto fill-in-the-gap ---------- */
const STOP = new Set('about after again always because before being could every first found from have little never other really should their there these they this those through under very want were what when where which while with would your into over then than them some just like only also came made make much many more most must said says each been does done'.split(' '));
function clozeQuestions(text, n) {
  const sents = (text.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+["”']?/g) || []).map(s => s.trim()).filter(s => s.split(' ').length >= 6);
  if (!sents.length) return [];
  const pool = [...new Set((text.toLowerCase().match(/[a-z]{4,}/g) || []))];
  const out = [], step = Math.max(1, sents.length / n);
  for (let i = 0; i < n && Math.floor(i * step) < sents.length; i++) {
    const s = sents[Math.floor(i * step)];
    const cands = (s.match(/[A-Za-z]{5,10}/g) || []).filter(w => !STOP.has(w.toLowerCase()));
    if (!cands.length) continue;
    const target = cands.sort((a, b) => b.length - a.length)[0];
    const t = target.toLowerCase();
    const wrong = shuffle(pool.filter(w => w !== t && Math.abs(w.length - t.length) <= 2 && !STOP.has(w))).slice(0, 2);
    if (wrong.length < 2) continue;
    out.push({ q: 'Which word fits the gap?  “' + s.replace(new RegExp('\\b' + target + '\\b'), '_____') + '”', a: t, w: wrong, auto: true });
  }
  return out;
}
function buildQuiz(ch) {
  const custom = (ch.qs || []).filter(q => q.q && q.a && q.w && q.w.filter(Boolean).length >= 1);
  let qs = shuffle(custom).slice(0, 3);
  if (qs.length < 3) qs = qs.concat(clozeQuestions(ch.text, 3 - qs.length));
  return qs.map(q => { const opts = shuffle([q.a, ...q.w.filter(Boolean)]); return { q: q.q, opts, ans: opts.indexOf(q.a) }; });
}
const autoSummary = t => { const s = (t.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+/g) || [t]).slice(0, 2).join(' ').trim(); return s.length > 170 ? s.slice(0, 167) + '…' : s; };
const summaryOf = ch => ch.summary || autoSummary(ch.text);

/* ---------- read aloud ---------- */
const synth = window.speechSynthesis;
let speaking = false;
function stopSpeak() { speaking = false; try { synth && synth.cancel(); } catch (e) {} const b = $('[data-act=listen]'); if (b) b.innerHTML = '🔊 Read to me'; }
function speak(text) {
  if (!synth) return toast('Sorry, this device cannot read aloud.');
  if (speaking) return stopSpeak();
  speaking = true; $('[data-act=listen]').innerHTML = '⏹️ Stop';
  const parts = text.replace(/\n+/g, ' ').match(/[^.!?]+[.!?]*/g) || [text]; let i = 0;
  const next = () => { if (!speaking || i >= parts.length) return stopSpeak(); const u = new SpeechSynthesisUtterance(parts[i++].trim()); u.rate = .9; u.onend = next; u.onerror = stopSpeak; synth.speak(u); };
  next();
}

}

  const unlocked = i => ui.teacher || i === 0 || p.done.includes(i - 1);
  const pct = Math.round(p.done.length / b.chapters.length * 100);
  const canEdit = ui.teacher || (L && b.ownerId === L.id);
  return `<button class="btn small ghost" data-act="home">◀ Shelf</button>
  <div class="row" style="margin:18px 0"><div style="width:110px"><div class="cover" style="background:${b.color};aspect-ratio:3/4"><span class="em" style="font-size:2.4rem">${b.emoji}</span><small></small></div></div>
    <div style="flex:1;min-width:220px"><h1 style="font-size:2.2rem">${esc(b.title)}</h1><p class="muted" style="margin:0 0 8px">by ${esc(b.author)}</p>
      <div class="bar"><i style="width:${pct}%"></i></div><span class="hint">Reading progress • ${pct}%</span>
      ${canEdit ? `<div style="margin-top:8px"><button class="btn small ghost" data-act="editBook" data-id="${b.id}">✏️ Edit book</button></div>` : ''}</div></div>

  <div class="path">${b.chapters.map((c, i) => {
    const done = p.done.includes(i), open = unlocked(i), state = done ? 'done' : open ? 'now' : 'lock';
    return `<div class="step ${state}"><div class="node">${done ? '✓' : open ? i + 1 : '🔒'}</div>

       ${open ? `<span class="hint">⏱️ about ${Math.max(1, Math.round(words(c.text) / 120))} min${p.best[i] != null ? ' · best check-in ' + '⭐'.repeat(p.best[i]) : ''}</span>

        : `<div class="hint" style="color:var(--soft)">Finish chapter ${i} and pass its check-in to get a sneak peek and open this one.</div>`}
     </div></div>`;
  }).join('')}</div>

const buildQuizSize = c => Math.min(3, ((c.qs || []).filter(q => q.q && q.a).length) + clozeQuestions(c.text, 3).length) || 0;

/* ---- check-in ---- */
function startQuiz() {
  const b = book(ui.bookId), c = b.chapters[ui.ch];
  ui.quiz = { qs: buildQuiz(c), i: 0, score: 0, picked: null };
  if (!ui.quiz.qs.length) return finishQuiz(true);
  ui.view = 'check'; render();
}
function vCheck() {
  const z = ui.quiz, q = z.qs[z.i];
  return `<button class="btn small ghost" data-act="read" data-i="${ui.ch}">◀ Peek back at the story</button>
  <div class="card" style="margin-top:14px"><div class="dots">${z.qs.map((_, k) => `<i class="${k < z.i ? (z.res[k] ? 'ok' : 'no') : k === z.i ? 'on' : ''}"></i>`).join('')}</div>
    <span class="hint">Question ${z.i + 1} of ${z.qs.length}</span>
    <div class="q">${esc(q.q)}</div>
    ${q.opts.map((o, k) => {
      let cls = ''; if (z.picked != null) cls = k === q.ans ? 'right' : k === z.picked ? 'wrong' : 'dim';
      return `<button class="opt ${cls}" data-act="answer" data-i="${k}" ${z.picked != null ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('')}
    ${z.picked != null ? `<div class="pop" style="margin:8px 0 14px;font-size:1.15rem"><b>${z.picked === q.ans ? ['Yes! 🎉', 'Spot on! ⭐', 'You got it! 💪'][z.i % 3] : 'Good try! The answer was “' + esc(q.opts[q.ans]) + '”. 💛'}</b></div>
      <button class="btn" data-act="nextQ">${z.i + 1 < z.qs.length ? 'Next question ▶' : 'See how I did ▶'}</button>` : ''}
  </div>`;
}
function finishQuiz(noQuestions) {
  const b = book(ui.bookId), z = ui.quiz || { qs: [], score: 0 };
  const total = z.qs.length, score = z.score, need = total ? Math.ceil(total * 2 / 3) : 0;
  const pass = noQuestions || score >= need;
  if (!ui.teacher) S.log.push({ lid: ui.me, bid: b.id, ch: ui.ch, score, total, pass, ts: Date.now() });
  if (!pass) { save(); ui.view = 'retry'; ui.reward = { score, total }; return render(); }
  ui.reward = ui.teacher ? { preview: true, score, total } : award(score, total);
  ui.view = 'reward'; render();
}
function vRetry() {
  const r = ui.reward;
  return `<div class="card center" style="max-width:560px;margin:20px auto">${pip(120, 'wow')}<h2>So close! ${r.score} out of ${r.total}.</h2>
   <p style="font-size:1.15rem">Stories can be tricky, and that's okay. Pip thinks a second read will help. The unlock is waiting for you.</p>
   <div class="row" style="justify-content:center"><button class="btn" data-act="read" data-i="${ui.ch}">📖 Read it again</button><button class="btn sun" data-act="check">Try the questions again</button></div></div>`;
}

/* ---- award points / badges / streak ---- */
function award(score, total) {
  const L = me(), b = book(ui.bookId), p = prog(L, b.id);
  const first = !p.done.includes(ui.ch);
  let pts = 0; const newBadges = [];
  p.last = Date.now(); p.best[ui.ch] = Math.max(p.best[ui.ch] || 0, score);
  if (first) { p.done.push(ui.ch); pts += 50; if (total && score === total) pts += 20; }
  const t = today(), y = today(new Date(Date.now() - 864e5));
  if (L.lastDay !== t) { L.streak = L.lastDay === y ? (L.streak || 0) + 1 : 1; L.lastDay = t; }
  L.points += pts;
  const bookDone = p.done.length === b.chapters.length;
  BADGES.forEach(bd => { if (!L.badges.includes(bd.id) && bd.test(L, { score, total, bookDone: bookDone && first })) { L.badges.push(bd.id); newBadges.push(bd); } });
  save();
  const next = b.chapters[ui.ch + 1];
  return { pts, first, newBadges, score, total, bookDone, next, nextIdx: ui.ch + 1 };
}
function vReward() {
  const r = ui.reward, b = book(ui.bookId);
  if (r.preview) return `<div class="card center" style="max-width:560px;margin:20px auto">${pip(120)}<h2>Teacher preview done!</h2><p>Learners would see ${r.score}/${r.total}. Nothing was saved.</p><button class="btn" data-act="openBook" data-id="${b.id}">Back to the book</button></div>`;
  return `<div class="card center pop" style="max-width:600px;margin:10px auto"><div style="font-size:4rem">${r.bookDone ? '🏆' : '⭐'}</div>
    <h1>${r.bookDone ? 'You finished the whole book!' : r.first ? 'Chapter complete!' : 'Nice re-read!'}</h1>
    <div class="big">${r.pts ? '+' + r.pts : '✓'}</div><p class="muted" style="margin-top:0">${r.pts ? 'reading points' : 'no extra points this time, but practice makes a reader'}</p>
    <p style="font-size:1.1rem">You got <b>${r.score} of ${r.total}</b> right ${r.score === r.total ? '🧠' : '👏'}</p>
    ${r.newBadges.map(x => `<div class="badge pop" style="display:inline-flex;margin:4px"><span>${x.e}</span>New badge: ${x.n}</div>`).join('')}
    ${r.next ? `<div class="peek" style="text-align:left;margin:18px 0"><b>🔓 Unlocked, a sneak peek at chapter ${r.nextIdx + 1}:</b><br>${esc(summaryOf(r.next))}</div>
      <div class="row" style="justify-content:center"><button class="btn leaf" data-act="read" data-i="${r.nextIdx}">Read chapter ${r.nextIdx + 1} ▶</button><button class="btn ghost" data-act="openBook" data-id="${b.id}">My path</button></div>`
      : `<p>That's the end of <b>${esc(b.title)}</b>. Time to pick another quest!</p><button class="btn" data-act="home">Back to the shelf</button>`}
  </div>`;
}

function syncDraft(el) {
  const d = ui.draft, f = el.dataset.f, i = +el.dataset.ch, k = +el.dataset.k; if (!d || !f) return;
  const v = el.value;
  if (f === 'title') d.title = v; else if (f === 'author') d.author = v; else if (f === 'paste') d.paste = v;
  else if (f === 'ctitle') d.chapters[i].title = v; else if (f === 'ctext') { d.chapters[i].text = v; const l = el.previousElementSibling; if (l) l.textContent = `The story (${words(v)} words)`; }
  else if (f === 'csum') d.chapters[i].summary = v;
  else if (/^q/.test(f)) { const qs = d.chapters[i].qs; qs[k] ||= { q: '', a: '', w: ['', ''] };
    if (f === 'qq') qs[k].q = v; else if (f === 'qa') qs[k].a = v; else qs[k].w[+f[2]] = v; }
}
function splitText(raw) {
  const text = raw.replace(/\r/g, '').trim(); if (!text) return [];
  const re = /^\s*(chapter\s+[\w]+)\s*[:\-–.]?\s*(.*)$/gim; const marks = []; let m;
  while ((m = re.exec(text))) marks.push({ idx: m.index, end: re.lastIndex, title: (m[2] || m[1]).trim() || m[1] });
  if (marks.length) return marks.map((k, n) => ({ title: k.title, text: text.slice(k.end, (marks[n + 1] || { idx: text.length }).idx).trim(), summary: '', qs: [] })).filter(c => c.text);
  const paras = text.split(/\n\s*\n/); const out = []; let cur = [], w = 0;
  paras.forEach(p => { cur.push(p); w += words(p); if (w >= 220) { out.push(cur.join('\n\n')); cur = []; w = 0; } });
  if (cur.length) out.push(cur.join('\n\n'));
  return out.map((t, n) => ({ title: 'Part ' + (n + 1), text: t, summary: '', qs: [] }));
}
function saveBook() {
  const d = ui.draft, L = me();
  const title = d.title.trim(); if (!title) return toast('Give your book a title first 📘');
  const chapters = d.chapters.filter(c => c.text.trim()).map((c, i) => ({
    title: c.title.trim() || 'Chapter ' + (i + 1), text: c.text.trim(), summary: c.summary.trim(),
    qs: c.qs.filter(q => q && q.q.trim() && q.a.trim() && (q.w || []).some(x => x.trim())).map(q => ({ q: q.q.trim(), a: q.a.trim(), w: q.w.map(x => x.trim()).filter(Boolean) })) }));
  if (!chapters.length) return toast('Add some words to at least one chapter ✍️');
  const author = d.author.trim() || (ui.teacher ? 'Your teacher' : L.name);
  if (d.id) { const b = book(d.id); Object.assign(b, { title, author, emoji: d.emoji, color: d.color, chapters }); }
  else { S.books.push({ id: uid(), title, author, emoji: d.emoji, color: d.color, chapters, addedBy: ui.teacher ? 'teacher' : 'learner', ownerId: ui.teacher ? null : L.id, approved: ui.teacher }); }
  let extra = '';
  if (!ui.teacher && !d.id) { const bd = BADGES.find(b => b.id === 'builder'); if (!L.badges.includes('builder')) { L.badges.push('builder'); extra = ' You earned the Book Builder badge 🛠️'; } }
  save(); toast(ui.teacher ? 'Book added to the class shelf 🎉' : 'Your book is on your shelf!' + extra);
  ui.draft = null; if (ui.teacher) { ui.view = 'teacher'; ui.tab = 'books'; } else ui.view = 'home'; render();
}

/* ============================================================
   TEACHER AREA
   ============================================================ */
function vTeacher() {
  const tabs = [['class', '📊 My class'], ['books', '📚 Books'], ['add', '➕ Add a book']];
  let body = '';
  if (ui.tab === 'class') {
    const total = S.learners.reduce((n, l) => n + chaptersDone(l), 0), pct = Math.min(100, Math.round(total / S.goal * 100));
    body = `<div class="card" style="background:#e9fbff"><span class="tag blue">Class challenge</span><h3 style="margin-top:6px">Together we've finished ${total} of ${S.goal} chapters</h3>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="row" style="margin-top:8px"><span class="hint">Goal:</span><input type="number" min="1" max="999" value="${S.goal}" data-f="goal" style="width:90px"><span class="hint">A shared goal, not a race. Nobody is ranked.</span></div></div>
    <h2 style="margin-top:24px">Learners <span class="hint" style="font-family:var(--body)">(alphabetical on purpose)</span></h2>
    ${S.learners.length ? S.learners.slice().sort((a, b) => a.name.localeCompare(b.name)).map(l => {
      const logs = S.log.filter(x => x.lid === l.id).slice(-8).reverse(), avgs = S.log.filter(x => x.lid === l.id && x.total), avg = avgs.length ? Math.round(avgs.reduce((n, x) => n + x.score / x.total, 0) / avgs.length * 100) : null;
      const active = S.books.filter(b => prog(l, b.id).done.length);
      return `<div class="card" style="margin-bottom:14px"><div class="row"><span style="font-size:2.4rem">${l.avatar}</span><div style="flex:1"><h3 style="margin:0">${esc(l.name)}</h3><span class="hint">⭐ ${l.points} · 🔥 ${l.streak || 0} · ${chaptersDone(l)} chapters · avg check-in ${avg == null ? '–' : avg + '%'}</span></div>
        <button class="btn small pink" data-act="delLearner" data-id="${l.id}">Remove</button></div>
        ${active.map(b => { const n = prog(l, b.id).done.length; return `<div style="margin-top:8px"><b>${b.emoji} ${esc(b.title)}</b> <span class="hint">${n}/${b.chapters.length}</span><div class="bar" style="height:12px"><i style="width:${n / b.chapters.length * 100}%"></i></div></div>`; }).join('') || '<p class="hint">Hasn\'t started a book yet. Gentle nudge time 🙂</p>'}
        ${logs.length ? `<details><summary>Recent check-ins</summary><table><tr><th>Book</th><th>Ch.</th><th>Score</th><th>When</th></tr>${logs.map(x => { const b = book(x.bid); return `<tr><td>${esc(b ? b.title : '(deleted)')}</td><td>${x.ch + 1}</td><td>${x.score}/${x.total} ${x.pass ? '✅' : '🔁'}</td><td>${new Date(x.ts).toLocaleDateString()}</td></tr>`; }).join('')}</table></details>` : ''}</div>`;
    }).join('') : '<div class="card center"><p>No learners yet. Ask your class to tap “I\'m new here” on the first screen.</p></div>'}
    <div class="row" style="margin-top:20px"><button class="btn small ghost" data-act="backup">💾 Save a backup file</button><label class="btn small ghost" style="margin:0;cursor:pointer">📂 Restore backup<input type="file" accept=".json" id="restorefile" hidden></label><button class="btn small ghost" data-act="changePin">🔑 Change teacher PIN</button></div>`;
  } else if (ui.tab === 'books') {
    const pending = S.books.filter(b => !b.approved);
    body = `${pending.length ? `<div class="card" style="background:#fff6d6;margin-bottom:18px"><span class="tag">Needs a look · ${pending.length}</span>
      ${pending.map(b => { const o = S.learners.find(l => l.id === b.ownerId); return `<div class="row" style="margin-top:10px"><span style="font-size:2rem">${b.emoji}</span><div style="flex:1"><b>${esc(b.title)}</b><br><span class="hint">by ${esc(b.author)} · added by ${o ? esc(o.name) : 'a learner'} · ${b.chapters.length} ch.</span></div>
        <button class="btn small" data-act="openBook" data-id="${b.id}">Preview</button><button class="btn small leaf" data-act="approve" data-id="${b.id}">✅ Approve</button><button class="btn small pink" data-act="delBook" data-id="${b.id}">No thanks</button></div>`; }).join('')}</div>` : ''}
    <h2>Class shelf</h2>${S.books.filter(b => b.approved).map(b => `<div class="card row" style="margin-bottom:12px"><span style="font-size:2.2rem">${b.emoji}</span><div style="flex:1;min-width:160px"><b>${esc(b.title)}</b><br><span class="hint">${esc(b.author)} · ${b.chapters.length} chapters · ${b.addedBy === 'learner' ? 'learner-made' : 'teacher-added'}</span></div>
      <button class="btn small ghost" data-act="openBook" data-id="${b.id}">Preview</button><button class="btn small ghost" data-act="editBook" data-id="${b.id}">Edit</button><button class="btn small ghost" data-act="shareBook" data-id="${b.id}">Share file</button><button class="btn small pink" data-act="delBook" data-id="${b.id}">Delete</button></div>`).join('')}`;
  }
  return `<h1 style="font-size:2.3rem">Teacher corner 🧑‍🏫</h1><p class="muted">Quick view of progress and understanding. Pressure-free.</p>
   <div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${ui.tab === k ? 'on' : ''}" data-act="tab" data-id="${k}">${n}</button>`).join('')}</div>${body}`;
}

/* ---- modals ---- */
function vModal() {
  const m = ui.modal;
  if (m === 'reader') return `<div class="modal"><div class="card"><h2>Welcome! 👋</h2><label for="m-name">What's your first name?</label><input id="m-name" type="text" maxlength="20" autocomplete="off" placeholder="First name only">
    <label>Pick your reading buddy</label><div class="picks" id="m-av">${AVATARS.map((a, i) => `<button class="pick ${i === 0 ? 'sel' : ''}" data-act="mAv" data-id="${a}">${a}</button>`).join('')}</div>
    <div class="row" style="margin-top:20px"><button class="btn leaf" data-act="mSaveReader">Let's go!</button><button class="btn ghost" data-act="mClose">Cancel</button></div></div></div>`;
  if (m === 'pin' || m === 'setpin') return `<div class="modal"><div class="card"><h2>${m === 'setpin' ? 'Set a teacher PIN' : 'Teacher PIN'} 🔑</h2>
    <p class="hint">${m === 'setpin' ? 'Choose 4 numbers. This keeps the teacher area (and book approvals) for grown-ups. It lives on this device only.' : 'Enter your 4-digit PIN.'}</p>
    <input id="m-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" style="font-size:1.6rem;letter-spacing:.5em;text-align:center">
    <div class="row" style="margin-top:20px"><button class="btn" data-act="mPin">OK</button><button class="btn ghost" data-act="mClose">Cancel</button></div>
    ${m === 'pin' ? '<p class="hint">Forgot it? Restoring a backup file or clearing this site\'s data resets the PIN.</p>' : ''}</div></div>`;
  return '';
}

/* ============================================================
   ACTIONS
   ============================================================ */
const go = (view, o = {}) => { Object.assign(ui, o, { view }); render(); };
const A = {
  home() { ui.teacher ? go('teacher') : ui.me ? go('home') : go('welcome'); },
  switch() { ui.me = null; ui.teacher = false; go('welcome'); },
  pick(el) { ui.me = el.dataset.id; ui.teacher = false; go('home'); },
  newReader() { ui.modal = 'reader'; render(); $('#m-name') && $('#m-name').focus(); },
  mAv(el) { document.querySelectorAll('#m-av .pick').forEach(b => b.classList.remove('sel')); el.classList.add('sel'); },
  mSaveReader() {
    const name = $('#m-name').value.trim().replace(/\s+/g, ' '); if (!name) return toast('Type your first name 🙂');
    const av = ($('#m-av .sel') || {}).dataset?.id || AVATARS[0];
    const L = { id: uid(), name, avatar: av, points: 0, streak: 0, lastDay: null, badges: [], progress: {} }; S.learners.push(L); save();
    ui.modal = null; ui.me = L.id; ui.teacher = false; go('home'); toast('Welcome, ' + name + '! 🎉');
  },
  mClose() { ui.modal = null; render(); },
  teacherIn() { ui.modal = S.pin ? 'pin' : 'setpin'; render(); $('#m-pin') && $('#m-pin').focus(); },
  changePin() { ui.modal = 'setpin'; ui.pinChange = true; render(); },
  mPin() {
    const v = $('#m-pin').value;
    if (!/^\d{4}$/.test(v)) return toast('Please use exactly 4 numbers');
    if (ui.modal === 'setpin') { S.pin = v; save(); toast('PIN saved 🔑'); }
    else if (v !== S.pin) return toast('That PIN doesn\'t match. Try again.');
    const wasChange = ui.pinChange; ui.pinChange = false; ui.modal = null;
    if (wasChange) return render();
    ui.teacher = true; ui.me = null; go('teacher', { tab: 'class' });
  },
  openBook(el) { ui.bookId = el.dataset.id; go('book'); },
  read(el) { ui.ch = +el.dataset.i; go('read'); },
  fontUp() { ui.rs = Math.min(36, ui.rs + 2); $('.text').style.setProperty('--rs', ui.rs + 'px'); },
  fontDn() { ui.rs = Math.max(16, ui.rs - 2); $('.text').style.setProperty('--rs', ui.rs + 'px'); },
  easy() { S.easy = !S.easy; document.body.classList.toggle('easy', S.easy); save(); const b = $('[data-act=easy]'); b.innerHTML = (S.easy ? '✅' : '🔤') + ' Easy-read letters'; },
  listen() { const b = book(ui.bookId); speak(b.chapters[ui.ch].title + '. ' + b.chapters[ui.ch].text); },
  check() { startQuiz(); },
  answer(el) {
    const z = ui.quiz, k = +el.dataset.i, q = z.qs[z.i]; if (z.picked != null) return;
    z.picked = k; (z.res ||= [])[z.i] = k === q.ans; if (k === q.ans) z.score++; render(); window.scrollTo(0, document.body.scrollHeight);
  },
  nextQ() { const z = ui.quiz; if (z.i + 1 < z.qs.length) { z.i++; z.picked = null; render(); } else finishQuiz(); },
  /* books */
  addBook() { ui.draft = newDraft(); go('add'); },
  tab(el) { ui.tab = el.dataset.id; if (ui.tab === 'add') { ui.draft = newDraft(); go('add'); } else render(); },
  tabBooks() { ui.tab = 'books'; go('teacher'); },
  editBook(el) { const b = book(el.dataset.id); ui.draft = { id: b.id, title: b.title, author: b.author, emoji: b.emoji, color: b.color, paste: '', chapters: JSON.parse(JSON.stringify(b.chapters)).map(c => ({ ...c, qs: c.qs || [] })) }; go('add'); },
  dEmoji(el) { ui.draft.emoji = el.dataset.id; keepScroll(); },
  dColor(el) { ui.draft.color = el.dataset.id; keepScroll(); },
  dAddCh() { ui.draft.chapters.push({ title: '', text: '', summary: '', qs: [] }); keepScroll(); },
  dDelCh(el) { if (confirm('Remove this chapter?')) { ui.draft.chapters.splice(+el.dataset.i, 1); keepScroll(); } },
  splitPaste() { const parts = splitText(ui.draft.paste); if (!parts.length) return toast('Paste some text first 📋'); ui.draft.chapters = parts; ui.draft.paste = ''; keepScroll(); toast(parts.length + ' chapter' + (parts.length > 1 ? 's' : '') + ' ready ✂️'); },
  saveBook() { saveBook(); },
  approve(el) { const b = book(el.dataset.id); b.approved = true; save(); toast('Approved! The class can see it now ✅'); render(); },
  delBook(el) { const b = book(el.dataset.id); if (confirm('Delete “' + b.title + '”? This cannot be undone.')) { S.books = S.books.filter(x => x.id !== b.id); save(); render(); } },
  delLearner(el) { const l = S.learners.find(x => x.id === el.dataset.id); if (confirm('Remove ' + l.name + ' and their progress?')) { S.learners = S.learners.filter(x => x !== l); S.log = S.log.filter(x => x.lid !== l.id); save(); render(); } },
  shareBook(el) { const b = book(el.dataset.id); download(b.title.replace(/\W+/g, '-') + '.pagequest.json', JSON.stringify({ pagequestBook: 1, title: b.title, author: b.author, emoji: b.emoji, color: b.color, chapters: b.chapters })); },
  backup() { download('pagequest-backup-' + today() + '.json', JSON.stringify(S)); },
};
function keepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && A[el.dataset.act]) { e.preventDefault(); A[el.dataset.act](el); } });
document.addEventListener('input', e => { if (e.target.dataset.f === 'goal') { S.goal = Math.max(1, +e.target.value || 1); save(); } else syncDraft(e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && ui.modal) { const b = $('#modal .btn:not(.ghost)'); b && b.click(); } if (e.key === 'Escape' && ui.modal) A.mClose(); });
const loadScript = u => new Promise((ok, no) => { const e = document.createElement('script'); e.src = u; e.onload = ok; e.onerror = () => no(new Error('offline')); document.head.appendChild(e); });
async function fileToText(f) {
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (ext === 'docx') {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() })).value;
  }
  if (ext === 'pdf') {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise; let out = '';
    for (let i = 1; i <= pdf.numPages; i++) { const pg = await (await pdf.getPage(i)).getTextContent(); let line = '';
      pg.items.forEach(it => { line += it.str; line += it.hasEOL ? '\n' : ' '; }); out += line + '\n\n'; }
    return out;
  }
  return await f.text();
}
document.addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const id = e.target.id, st = $('#upstatus');
  try {
    if (id === 'restorefile') { const d = JSON.parse(await f.text()); if (!d.books || !d.learners) throw 0; if (confirm('Replace everything on this device with the backup?')) { S = d; save(); ui.teacher = false; ui.me = null; go('welcome'); toast('Backup restored ✅'); } }
    else if (id === 'bookupload') {
      if (st) st.textContent = 'Reading your file…';
      const name = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
      let raw = await fileToText(f), d = ui.draft;
      let j = null; if (/\.json$/i.test(f.name)) { try { j = JSON.parse(raw); } catch (x) {} }
      if (j && j.pagequestBook) { Object.assign(d, { title: j.title, author: j.author, emoji: j.emoji, color: j.color, chapters: j.chapters.map(c => ({ ...c, qs: c.qs || [] })) }); render(); return toast('Book loaded. Check it, then save 📥'); }
      raw = raw.replace(/\u0000/g, '').trim();
      if (words(raw) < 15) throw new Error('empty');
      const parts = splitText(raw); if (!parts.length) throw new Error('empty');
      if (!d.title.trim()) d.title = name;
      d.chapters = parts; d.paste = ''; render(); toast(parts.length + ' chapter' + (parts.length > 1 ? 's' : '') + ' ready. Check it, then save 📥');
    }
  } catch (err) {
    const msg = err && err.message === 'offline' ? 'To read Word or PDF files we need internet for a moment. Try again online, or save it as .txt.' : err && err.message === 'empty' ? 'We couldn\'t find any words in that file. If it\'s a scanned PDF, try a .txt or Word version.' : 'We couldn\'t read that file. Try .txt, .docx or .pdf.';
    if (st) st.textContent = ''; toast(msg);
  }
  e.target.value = '';
});
window.addEventListener('beforeunload', stopSpeak);
render();
</script>
